[package]
name = "tianai-captcha"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
dashmap = "6.2.1"
image = { version = "0.25.10", features = ["jpeg", "png", "webp"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
